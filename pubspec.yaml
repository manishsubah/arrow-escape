name: arrow_puzzle
description: "Arrow Escape - A grid-based arrow elimination puzzle game."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  audioplayers: ^6.4.0
  google_fonts: ^6.2.1
  google_mobile_ads: ^5.3.0
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
  image_path: assets/icons/app_icon_1024.png
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: assets/icons/app_icon_1024.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  # google_mobile_ads (and its transitive webview_flutter_wkwebview dependency)
  # is integrated via CocoaPods, so keep Swift Package Manager off for iOS/macOS
  # to avoid the mixed-integration pod install failure.
  config:
    enable-swift-package-manager: false

  assets:
    - assets/data/
    - assets/sounds/
    - assets/icons/
