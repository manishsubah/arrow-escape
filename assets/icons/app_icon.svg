<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="roundedClip">
      <rect x="0" y="0" width="1024" height="1024" rx="225" ry="225"/>
    </clipPath>
  </defs>

  <!-- Rounded square background -->
  <rect width="1024" height="1024" rx="225" ry="225" fill="url(#bgGrad)"/>

  <g clip-path="url(#roundedClip)">
    <!-- Subtle 4x4 puzzle grid -->
    <g opacity="0.15" stroke="#64748B" stroke-width="3" fill="none">
      <line x1="212" y1="212" x2="812" y2="212"/>
      <line x1="212" y1="412" x2="812" y2="412"/>
      <line x1="212" y1="612" x2="812" y2="612"/>
      <line x1="212" y1="812" x2="812" y2="812"/>
      <line x1="212" y1="212" x2="212" y2="812"/>
      <line x1="412" y1="212" x2="412" y2="812"/>
      <line x1="612" y1="212" x2="612" y2="812"/>
      <line x1="812" y1="212" x2="812" y2="812"/>
    </g>

    <!-- Grid cell accents -->
    <rect x="212" y="612" width="200" height="200" rx="24" fill="#1E293B" opacity="0.6"/>
    <rect x="412" y="412" width="200" height="200" rx="24" fill="#1E293B" opacity="0.4"/>

    <!-- Amber puzzle piece accent (bottom-left) -->
    <rect x="212" y="612" width="200" height="200" rx="24" fill="#F59E0B" opacity="0.85"/>
    <path d="M 312 680 L 312 744 M 280 712 L 344 712" stroke="#F8FAFC" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.9"/>

    <!-- Glow behind hero arrow -->
    <g filter="url(#glow)" opacity="0.35">
      <path d="M 380 680 L 380 340 L 720 340 L 720 420 L 480 420 L 480 680 Z" fill="#3B82F6" transform="rotate(-45 512 512) translate(40 -20)"/>
    </g>

    <!-- Hero arrow block pointing up-right (escape direction) -->
    <g transform="translate(512 512) rotate(-45) translate(-170 -170)">
      <!-- Arrow body -->
      <rect x="0" y="60" width="280" height="220" rx="36" fill="url(#arrowGrad)"/>
      <!-- Arrow tip -->
      <polygon points="280,170 400,170 280,50" fill="url(#arrowGrad)"/>
      <!-- White direction indicator -->
      <path d="M 140 200 L 140 140 M 110 165 L 170 165" stroke="#F8FAFC" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.95"/>
      <path d="M 110 165 L 140 130 L 170 165" stroke="#F8FAFC" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95"/>
    </g>

    <!-- Small cyan accent cell (top-right) -->
    <rect x="612" y="212" width="200" height="200" rx="24" fill="#06B6D4" opacity="0.25"/>
  </g>
</svg>
